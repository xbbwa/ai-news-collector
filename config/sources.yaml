  # ============================================================================
  # Tier 3 — social / aggregators (fastest signal, noisiest; discovery only)
  # ============================================================================
  - id: hackernews-ai
    name: Hacker News (AI stories)
    type: hackernews
    tier: 3
    interval: 120
    params:
      min_points: 5
      hits_per_page: 50
      queries:
        - LLM
        - OpenAI
        - Anthropic
        - Claude
        - GPT
        - Gemini
        - DeepSeek
        - Qwen
