# AI news sources.
#
# Fields (see collector/config.py SourceConfig):
#   id            unique slug
#   type          rss | hackernews | reddit
#   tier          1 = first-party (labs/companies/arXiv), 2 = professional media, 3 = social/aggregator
#   interval      poll interval in seconds
#   proxy         true = route through PROXY_URL (domains commonly unreachable from mainland China)
#   keywords      optional; only keep entries whose title/summary contains one of these (case-insensitive)
#   fetch_fulltext  download the article page and extract main text (default true)
#   max_age_days  ignore entries published earlier than N days ago (null = keep everything)
#   ${RSSHUB_URL} is replaced with the RSSHUB_URL env var (default http://localhost:1200)
#
# Full-text download automatically falls back to a Chrome-fingerprint client for sites behind
# Cloudflare (openai.com etc.), so no per-source flag is needed for that.

defaults:
  interval: 300
  fetch_fulltext: true
  proxy: false
  enabled: true
  max_age_days: 7

# Shared keyword list for general-purpose feeds (tech media that cover more than AI).
# YAML anchors keep it in one place.
x-ai-keywords: &ai_keywords
  - " AI"
  - "AI "
  - "A.I."
  - "人工智能"
  - "大模型"
  - "LLM"
  - "GPT"
  - "OpenAI"
  - "Anthropic"
  - "Claude"
  - "Gemini"
  - "DeepMind"
  - "DeepSeek"
  - "通义"
  - "Qwen"
  - "Kimi"
  - "智谱"
  - "GLM"
  - "豆包"
  - "文心"
  - "Llama"
  - "Mistral"
  - "Hugging Face"
  - "NVIDIA"
  - "英伟达"
  - "机器学习"
  - "machine learning"
  - "neural"
  - "diffusion"
  - "transformer"
  - "agent"
  - "智能体"
  - "多模态"
  - "multimodal"
  - "AGI"
  - "算力"
  - "芯片"

sources:
  # ============================================================================
  # Tier 1 — first-party: labs, companies, arXiv
  # ============================================================================
  - id: openai-news
    name: OpenAI News
    type: rss
    url: https://openai.com/news/rss.xml
    tier: 1
    interval: 120
    proxy: true

  - id: deepmind-blog
    name: Google DeepMind Blog
    type: rss
    url: https://deepmind.google/blog/rss.xml
    tier: 1
    interval: 180
    proxy: true

  - id: google-ai-blog
    name: Google — The Keyword (AI)
    type: rss
    url: https://blog.google/technology/ai/rss/
    tier: 1
    interval: 180
    proxy: true

  # ai.meta.com no longer serves an RSS feed (returns 400). Engineering blog is the
  # closest first-party feed; AI-specific posts are filtered by keyword.
  - id: meta-engineering
    name: Engineering at Meta
    type: rss
    url: https://engineering.fb.com/feed/
    tier: 1
    interval: 600
    proxy: true
    keywords: *ai_keywords

  - id: huggingface-blog
    name: Hugging Face Blog
    type: rss
    url: https://huggingface.co/blog/feed.xml
    tier: 1
    interval: 300
    proxy: true

  - id: microsoft-research
    name: Microsoft Research Blog
    type: rss
    url: https://www.microsoft.com/en-us/research/feed/
    tier: 1
    interval: 600

  - id: nvidia-blog
    name: NVIDIA Blog
    type: rss
    url: https://blogs.nvidia.com/feed/
    tier: 1
    interval: 600
    keywords: *ai_keywords

  - id: aws-ml-blog
    name: AWS Machine Learning Blog
    type: rss
    url: https://aws.amazon.com/blogs/machine-learning/feed/
    tier: 1
    interval: 900

  - id: mistral-news
    name: Mistral AI News
    type: rss
    url: https://mistral.ai/news/rss
    tier: 1
    interval: 600
    proxy: true

  # Anthropic has no RSS feed. Use RSSHub if a route exists in your instance, or a
  # page-diff route; otherwise Anthropic news arrives via tier-2/3 sources within minutes.
  # - id: anthropic-news
  #   name: Anthropic News
  #   type: rss
  #   url: ${RSSHUB_URL}/anthropic/news
  #   tier: 1
  #   interval: 180
  #   proxy: true

  # --- arXiv (daily batch, announced ~00:00 UTC on weekdays) ---
  - id: arxiv-cs-ai
    name: arXiv cs.AI
    type: rss
    url: https://rss.arxiv.org/rss/cs.AI
    tier: 1
    lang: en
    interval: 1800
    fetch_fulltext: false   # RSS already carries the abstract; the abs page adds nothing

  - id: arxiv-cs-cl
    name: arXiv cs.CL
    type: rss
    url: https://rss.arxiv.org/rss/cs.CL
    tier: 1
    interval: 1800
    fetch_fulltext: false

  - id: arxiv-cs-lg
    name: arXiv cs.LG
    type: rss
    url: https://rss.arxiv.org/rss/cs.LG
    tier: 1
    interval: 1800
    fetch_fulltext: false

  - id: arxiv-cs-cv
    name: arXiv cs.CV
    type: rss
    url: https://rss.arxiv.org/rss/cs.CV
    tier: 1
    interval: 1800
    fetch_fulltext: false

  # ============================================================================
  # Tier 2 — professional media (international)
  # ============================================================================
  - id: techcrunch-ai
    name: TechCrunch — AI
    type: rss
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    tier: 2
    interval: 180

  - id: theverge-ai
    name: The Verge — AI
    type: rss
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    tier: 2
    interval: 180

  # The /category/ai/ feed updates only a few times a week; the main feed is much fresher.
  - id: venturebeat
    name: VentureBeat
    type: rss
    url: https://venturebeat.com/feed/
    tier: 2
    interval: 300
    keywords: *ai_keywords

  - id: mit-tech-review
    name: MIT Technology Review
    type: rss
    url: https://www.technologyreview.com/feed/
    tier: 2
    interval: 600
    keywords: *ai_keywords

  - id: arstechnica-ai
    name: Ars Technica — AI
    type: rss
    url: https://arstechnica.com/ai/feed/
    tier: 2
    interval: 300

  - id: wired-ai
    name: WIRED — AI
    type: rss
    url: https://www.wired.com/feed/tag/ai/latest/rss
    tier: 2
    interval: 600

  - id: the-decoder
    name: The Decoder
    type: rss
    url: https://the-decoder.com/feed/
    tier: 2
    interval: 300

  - id: import-ai
    name: Import AI (Jack Clark)
    type: rss
    url: https://importai.substack.com/feed
    tier: 2
    interval: 1800
    proxy: true

  - id: simon-willison
    name: Simon Willison's Weblog
    type: rss
    url: https://simonwillison.net/atom/everything/
    tier: 2
    interval: 600

  - id: bloomberg-tech
    name: Bloomberg Technology
    type: rss
    url: https://feeds.bloomberg.com/technology/news.rss
    tier: 2
    interval: 300
    keywords: *ai_keywords
    fetch_fulltext: false   # paywalled; keep headline + summary only

  # ============================================================================
  # Tier 2 — professional media (China)
  # ============================================================================
  # jiqizhixin.com/rss was shut down (now redirects to a marketing page); go through RSSHub.
  # Verify the route exists on your RSSHub instance: curl $RSSHUB_URL/jiqizhixin
  - id: jiqizhixin
    name: 机器之心
    type: rss
    url: ${RSSHUB_URL}/jiqizhixin
    tier: 2
    lang: zh
    interval: 180

  - id: qbitai
    name: 量子位
    type: rss
    url: https://www.qbitai.com/feed
    tier: 2
    lang: zh
    interval: 180

  - id: infoq-cn
    name: InfoQ 中文
    type: rss
    url: https://www.infoq.cn/feed
    tier: 2
    lang: zh
    interval: 600
    keywords: *ai_keywords

  - id: 36kr-newsflash
    name: 36氪 快讯
    type: rss
    url: ${RSSHUB_URL}/36kr/newsflashes
    tier: 2
    lang: zh
    interval: 120
    keywords: *ai_keywords
    fetch_fulltext: false   # newsflashes are already full text in the feed

  - id: 36kr-ai
    name: 36氪 AI 频道
    type: rss
    url: ${RSSHUB_URL}/36kr/information/ai
    tier: 2
    lang: zh
    interval: 300

  # huxiu.com/rss/0.xml hangs for 60s+ per request; RSSHub route is reliable.
  - id: huxiu
    name: 虎嗅
    type: rss
    url: ${RSSHUB_URL}/huxiu/article
    tier: 2
    lang: zh
    interval: 600
    keywords: *ai_keywords

  - id: ifanr
    name: 爱范儿
    type: rss
    url: https://www.ifanr.com/feed
    tier: 2
    lang: zh
    interval: 600
    keywords: *ai_keywords

  - id: geekpark
    name: 极客公园
    type: rss
    url: ${RSSHUB_URL}/geekpark
    tier: 2
    lang: zh
    interval: 600
    keywords: *ai_keywords

  - id: sspai
    name: 少数派
    type: rss
    url: https://sspai.com/feed
    tier: 2
    lang: zh
    interval: 900
    keywords: *ai_keywords

  - id: leiphone
    name: 雷峰网
    type: rss
    url: https://www.leiphone.com/feed
    tier: 2
    lang: zh
    interval: 600
    keywords: *ai_keywords

  # WeChat official accounts (新智元 / 量子位 / 机器之心 / 硅星人 / 智东西 ...) have no RSS.
  # Recommended: self-host WeWe RSS (https://github.com/cooderl/wewe-rss) on the Ubuntu box,
  # then add each account's feed below. Example:
  # - id: wechat-xinzhiyuan
  #   name: 新智元 (公众号)
  #   type: rss
  #   url: http://localhost:4000/feeds/<mp_id>.atom
  #   tier: 2
  #   lang: zh
  #   interval: 300

  # ============================================================================
  # Tier 3 — social / aggregators (fastest signal, noisiest; discovery only)
  # ============================================================================
  - id: hackernews-ai
    name: Hacker News (AI stories)
    type: hackernews
    tier: 3
    interval: 120
    params:
      min_points: 5
      hits_per_page: 50
      queries:
        - LLM
        - OpenAI
        - Anthropic
        - Claude
        - GPT
        - Gemini
        - DeepSeek
        - Qwen
        - Llama
        - Mistral
        - "AI model"
        - "open source model"
        - Hugging Face
        - Nvidia

  - id: reddit-machinelearning
    name: r/MachineLearning
    type: reddit
    tier: 3
    interval: 300
    proxy: true
    params:
      subreddit: MachineLearning
      listing: new
      limit: 50

  - id: reddit-localllama
    name: r/LocalLLaMA
    type: reddit
    tier: 3
    interval: 180
    proxy: true
    params:
      subreddit: LocalLLaMA
      listing: new
      limit: 50

  - id: reddit-artificial
    name: r/artificial
    type: reddit
    tier: 3
    interval: 600
    proxy: true
    params:
      subreddit: artificial
      listing: hot
      limit: 50

  - id: github-trending
    name: GitHub Trending (daily)
    type: rss
    url: ${RSSHUB_URL}/github/trending/daily/any/en
    tier: 3
    interval: 1800
    proxy: true
    fetch_fulltext: false

  # X/Twitter via RSSHub requires the instance to be configured with account cookies
  # (TWITTER_USERNAME / TWITTER_PASSWORD or TWITTER_COOKIE). Once set, enable e.g.:
  # - id: x-openai
  #   name: X @OpenAI
  #   type: rss
  #   url: ${RSSHUB_URL}/twitter/user/OpenAI
  #   tier: 1
  #   interval: 120
  #   proxy: true
  #   fetch_fulltext: false
