  # Reddit is read from the public Atom feed (/r/<subreddit>/<listing>/.rss); no account needed.
  # Reddit allows anonymous clients one request per minute per IP, so the fetcher spaces reddit
  # requests 61s apart process-wide. A multireddit ("a+b+c") fetches several subreddits in one
  # request; raw.subreddit still records each post's own subreddit. No score / comment count.
  - id: reddit-ai-new
    name: Reddit AI subreddits (new)
    type: reddit
    tier: 3
    interval: 180
    proxy: true
    params:
      subreddit: MachineLearning+LocalLLaMA+artificial+singularity+OpenAI+ClaudeAI+StableDiffusion
      listing: new
      limit: 100

  - id: reddit-ai-hot
    name: Reddit AI subreddits (hot)
