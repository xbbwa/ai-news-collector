# AI news sources.
#
# Fields (see collector/config.py SourceConfig):
#   id            unique slug
#   type          rss | hackernews | reddit | huggingface
#   tier          1 = first-party (labs/companies/arXiv), 2 = professional media, 3 = social/aggregator
#   interval      poll interval in seconds
#   proxy         true = route through PROXY_URL (domains commonly unreachable from mainland China).
#                 Must stay false for ${RSSHUB_URL} sources: the RSSHub container does its own
#                 proxying (PROXY_URI in docker-compose.yml) and is reached over the local network.
#   keywords      optional; only keep entries whose title/summary matches. ASCII words match as whole
#                 tokens ("AI" hits "AI芯片" / "AI-powered", not "said" / "Airbnb"); CJK terms as substrings.
#   fetch_fulltext  download the article page and extract main text (default true)
#   max_age_days  ignore entries published earlier than N days ago (null = keep everything)
#   time_offset_hours  added to published_at; fixes feeds that stamp local time as GMT
#   ${RSSHUB_URL} is replaced with the RSSHUB_URL env var (default http://localhost:1200)
#
# Full-text download automatically falls back to a Chrome-fingerprint client for sites behind
# Cloudflare (openai.com etc.), so no per-source flag is needed for that.
#
# Health check: python scripts/check_sources.py   (fetches every source once without writing to the DB)

defaults:
  interval: 300
  fetch_fulltext: true
  proxy: false
  enabled: true
  max_age_days: 7

# Shared keyword list for general-purpose feeds (tech media that cover more than AI).
# YAML anchors keep it in one place. Do NOT add keywords to AI-vertical sources.
